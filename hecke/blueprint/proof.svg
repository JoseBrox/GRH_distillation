<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 665" role="img" aria-labelledby="title desc">
<title id="title">Hecke GRH proof map</title><desc id="desc">Two required arithmetic obligations remain open. The alternative spectral supplier is also open.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616e"/></marker></defs>
<rect width="800" height="665" rx="12" fill="#fcfdff"/>
<style>text{font-family:Arial,sans-serif;fill:#253341}.head{font-size:20px;font-weight:bold}.node{font-size:14px;font-weight:bold}.sub{font-size:12px}.edge{fill:none;stroke:#52616e;stroke-width:1.7;marker-end:url(#arr)}.proved{fill:#e6f4eb;stroke:#499367}.cited{fill:#e8f1fc;stroke:#648ab3}.open{fill:#fff1ec;stroke:#be6759}.goal{fill:#f0f2f5;stroke:#86929d}</style>
<text x="400" y="34" text-anchor="middle" class="head">Hecke GRH — independent arithmetic program</text>
<rect x="30" y="56" width="350" height="60" rx="8" class="cited"/><text x="205" y="81" text-anchor="middle" class="node">H01 Classical Hecke setup</text><text x="205" y="101" text-anchor="middle" class="sub">Euler product, continuation, reciprocity</text>
<rect x="420" y="56" width="350" height="60" rx="8" class="proved"/><text x="595" y="81" text-anchor="middle" class="node">H04 Galois-field reduction</text><text x="595" y="101" text-anchor="middle" class="sub">All unitary characters by norm pullback</text>
<rect x="30" y="152" width="350" height="62" rx="8" class="proved"/><text x="205" y="177" text-anchor="middle" class="node">H02 Direct Mellin zero detection</text><text x="205" y="197" text-anchor="middle" class="sub">One-sided whole-window criterion</text>
<rect x="420" y="152" width="350" height="62" rx="8" class="proved"/><text x="595" y="177" text-anchor="middle" class="node">H03 Degree-one prime reduction</text><text x="595" y="197" text-anchor="middle" class="sub">Elementary square-root remainder</text>
<rect x="30" y="246" width="350" height="62" rx="8" class="cited"/><text x="205" y="271" text-anchor="middle" class="node">H06 Abelian base case</text><text x="205" y="291" text-anchor="middle" class="sub">Dirichlet proof / external calibration</text>
<rect x="420" y="246" width="350" height="62" rx="8" class="proved"/><text x="595" y="271" text-anchor="middle" class="node">H05 Exact positive kernels</text><text x="595" y="291" text-anchor="middle" class="sub">All unitary characters, including ramification</text>
<rect x="30" y="349" width="350" height="72" rx="8" class="open"/><text x="205" y="374" text-anchor="middle" class="node">H07F Finite order — OPEN</text><text x="205" y="394" text-anchor="middle" class="sub">Relative split-prime counts; S3 benchmark</text>
<rect x="420" y="349" width="350" height="72" rx="8" class="open"/><text x="595" y="374" text-anchor="middle" class="node">H07I Infinite order — OPEN</text><text x="595" y="394" text-anchor="middle" class="sub">One-sided character phase counts</text>
<rect x="30" y="468" width="350" height="62" rx="8" class="open"/><text x="205" y="493" text-anchor="middle" class="node">H08 Optional trace route — OPEN</text><text x="205" y="513" text-anchor="middle" class="sub">Actual compatible geometric estimates</text>
<rect x="420" y="468" width="350" height="62" rx="8" class="goal"/><text x="595" y="493" text-anchor="middle" class="node">Critical line over Galois fields</text><text x="595" y="513" text-anchor="middle" class="sub">Conditional on complete suppliers</text>
<rect x="200" y="567" width="400" height="58" rx="8" class="goal"/><text x="400" y="592" text-anchor="middle" class="node">Hecke GRH over every number field</text><text x="400" y="612" text-anchor="middle" class="sub">Via H04 — not proved</text>
<path d="M205 116V151" class="edge"/><path d="M595 116V151" class="edge"/><path d="M595 214V245" class="edge"/><path d="M205 308V348" class="edge"/><path d="M595 308V348" class="edge"/><path d="M205 214H400V329H205V348" class="edge"/><path d="M400 329H595V348" class="edge"/><path d="M205 421V443H595V467" class="edge"/><path d="M595 421V467" class="edge"/><path d="M380 499H419" stroke-dasharray="5 4" class="edge"/><path d="M595 530V548H400V566" class="edge"/>
<text x="400" y="649" text-anchor="middle" class="sub">Green: proved reduction · Blue: cited input · Red: open supplier · 6/9 is not a proof percentage</text>
