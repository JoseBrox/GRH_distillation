<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 675" role="img" aria-labelledby="title desc">
<title id="title">Hecke GRH proof map</title><desc id="desc">Two alternative open suppliers feed proved reductions. Hecke GRH remains unproved.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616e"/></marker></defs>
<rect width="760" height="675" rx="12" fill="#fcfdff"/>
<style>text{font-family:Arial,sans-serif;fill:#253341}.head{font-size:20px;font-weight:bold}.node{font-size:14px;font-weight:bold}.sub{font-size:12px}.edge{fill:none;stroke:#52616e;stroke-width:1.7;marker-end:url(#arr)}.proved{fill:#e6f4eb;stroke:#499367}.cited{fill:#e8f1fc;stroke:#648ab3}.open{fill:#fff1ec;stroke:#be6759}.goal{fill:#f0f2f5;stroke:#86929d}</style>
<text x="380" y="34" text-anchor="middle" class="head">Hecke GRH — independent proof program</text>
<rect x="35" y="58" width="335" height="60" rx="8" class="cited"/><text x="202" y="81" class="node" text-anchor="middle">H01 Classical Hecke setup</text><text x="202" y="101" class="sub" text-anchor="middle">Explicit formula and zero theory</text>
<rect x="390" y="58" width="335" height="60" rx="8" class="proved"/><text x="557" y="81" class="node" text-anchor="middle">H04 Galois-field reduction</text><text x="557" y="101" class="sub" text-anchor="middle">All unitary characters by norm pullback</text>
<rect x="35" y="156" width="335" height="60" rx="8" class="proved"/><text x="202" y="179" class="node" text-anchor="middle">H03 Degree-one prime reduction</text><text x="202" y="199" class="sub" text-anchor="middle">Bounded error at centered scale</text>
<rect x="390" y="156" width="335" height="60" rx="8" class="proved"/><text x="557" y="179" class="node" text-anchor="middle">H05 Positive arithmetic kernels</text><text x="557" y="199" class="sub" text-anchor="middle">Split-prime phase weights and inertia</text>
<path d="M202 118V155" class="edge"/><path d="M557 118V155" class="edge"/>
<rect x="35" y="257" width="335" height="66" rx="8" class="open"/><text x="202" y="281" class="node" text-anchor="middle">H07 Arithmetic supplier — OPEN</text><text x="202" y="303" class="sub" text-anchor="middle">First benchmark: S3 Dedekind zeta</text>
<rect x="390" y="257" width="335" height="66" rx="8" class="cited"/><text x="557" y="281" class="node" text-anchor="middle">H06 Dirichlet / abelian calibration</text><text x="557" y="303" class="sub" text-anchor="middle">External theorem; restricted scope</text>
<path d="M202 216V256" class="edge"/><path d="M557 216V237H290V256" class="edge"/><path d="M390 290H371" stroke-dasharray="5 4" class="edge"/>
<rect x="35" y="364" width="335" height="64" rx="8" class="proved"/><text x="202" y="388" class="node" text-anchor="middle">H02 One-sided zero detection</text><text x="202" y="409" class="sub" text-anchor="middle">Growth law, sparse samples, three tests</text>
<rect x="390" y="364" width="335" height="64" rx="8" class="open"/><text x="557" y="388" class="node" text-anchor="middle">H08 Alternative trace supplier — OPEN</text><text x="557" y="409" class="sub" text-anchor="middle">Actual global/local trace comparison</text>
<path d="M202 323V363" class="edge"/><path d="M390 396H371" stroke-dasharray="5 4" class="edge"/>
<rect x="158" y="474" width="444" height="64" rx="8" class="goal"/><text x="380" y="498" class="node" text-anchor="middle">Critical line over Galois fields</text><text x="380" y="518" class="sub" text-anchor="middle">Conditional on a complete arithmetic or trace supplier</text><path d="M202 428V451H380V473" class="edge"/>
<rect x="158" y="573" width="444" height="58" rx="8" class="goal"/><text x="380" y="596" class="node" text-anchor="middle">Hecke GRH over every number field</text><text x="380" y="615" class="sub" text-anchor="middle">Via H04 — not proved</text><path d="M380 538V572" class="edge"/>
<text x="380" y="657" text-anchor="middle" class="sub">Green: proved reduction · Blue: cited input · Red: open supplier · 6/8 is not a proof percentage</text>
</svg>
